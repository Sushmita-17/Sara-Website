<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login | Sara Foods</title>
<link rel="stylesheet" href="style.css">
</head>
<body style="background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;">

<div class="product-card" style="width:100%; max-width:440px; padding:48px; box-shadow:var(--shadow-lg);">
    <div style="text-align:center; margin-bottom:32px;">
        <a href="/" style="text-decoration:none; display:inline-flex; align-items:center; gap:12px; color:var(--brand-primary); font-weight:800; font-size:1.8rem; margin-bottom:16px;">
            <img src="avatar.png" alt="Sara Foods" style="height:48px; width:48px; border-radius:50%; border:2px solid var(--brand-accent);">
            Sara Foods
        </a>
        <h1 style="font-size:1.8rem; color:var(--text-dark); margin-bottom:8px;">Welcome Back</h1>
        <p style="color:var(--text-muted); font-size:0.95rem;">Experience the purest Himalayan nature</p>
    </div>

    <div id="login-alert" class="badge" style="display:none; width:100%; padding:12px; margin-bottom:24px; text-align:center;"></div>

    <form id="login-form">
        <div style="margin-bottom:20px;">
            <label for="login-email" style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:8px; color:var(--text-dark);">Email Address</label>
            <input type="email" id="login-email" placeholder="name@example.com" required style="width:100%; padding:14px 20px; border-radius:var(--radius); border:1.5px solid var(--border); outline:none; font-family:inherit; transition:border-color 0.3s;">
        </div>
        <div style="margin-bottom:12px;">
            <label for="login-pass" style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:8px; color:var(--text-dark);">Password</label>
            <input type="password" id="login-pass" placeholder="Enter your password" required style="width:100%; padding:14px 20px; border-radius:var(--radius); border:1.5px solid var(--border); outline:none; font-family:inherit; transition:border-color 0.3s;">
        </div>
        <div style="text-align:right; margin-bottom:28px;">
            <a href="forgot-password.html" style="color:var(--brand-primary); font-weight:600; font-size:0.85rem; text-decoration:none;">Forgot password?</a>
        </div>
        
        <button type="submit" id="login-btn" class="cta-btn" style="width:100%; padding:16px; font-size:1rem;">Sign In</button>
    </form>

    <div style="display:flex; align-items:center; margin:32px 0; color:var(--text-muted); font-size:0.85rem;">
        <div style="flex:1; height:1px; background:var(--border);"></div>
        <span style="padding:0 16px;">or continue with</span>
        <div style="flex:1; height:1px; background:var(--border);"></div>
    </div>

    <button class="secondary-btn btn-google" style="width:100%; display:flex; align-items:center; justify-content:center; gap:12px; padding:14px; border-radius:50px; background:white;">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="height:20px;">
        Continue with Google
    </button>

    <div style="text-align:center; margin-top:32px; font-size:0.95rem; color:var(--text-muted);">
        Don't have an account? <a href="register.html" style="color:var(--brand-primary); font-weight:700; text-decoration:none;">Join Sara Foods</a>
    </div>
</div>

<script src="js/site.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script>
    var err = new URLSearchParams(location.search).get('error');
    if (err) showAlert(document.getElementById('login-alert'), 'Google sign-in failed. Use email login or try again.', 'error');

    const emailInput = document.getElementById('login-email');
    const passInput = document.getElementById('login-pass');
    
    [emailInput, passInput].forEach(input => {
        input.onfocus = () => input.style.borderColor = 'var(--brand-primary)';
        input.onblur = () => input.style.borderColor = 'var(--border)';
    });
</script>
</body>
</html>
