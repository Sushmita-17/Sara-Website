<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>All Products | Sara Foods</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="nav-container">
    <a href="/" class="logo"><img src="avatar.png" alt="Sara Foods">Sara Foods</a>
    
    <div class="search-wrapper">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="global-search" placeholder="Search in results...">
    </div>

    <nav>
      <a href="/">Home</a>
      <a href="products.html" class="active">Shop</a>
      <a href="admin.html" id="nav-admin" style="display:none; color:var(--brand-accent);">Dashboard</a>
      <a href="/#contact">Contact</a>
    </nav>

    <div class="nav-actions">
      <button class="cart-btn" id="cart-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Cart <span class="cart-badge">0</span>
      </button>
      
      <div id="nav-user" style="display:none;align-items:center;gap:12px;">
        <span id="nav-username" style="font-weight:600;font-size:0.9rem;">User</span>
        <button id="nav-logout" class="cta-btn" style="padding:8px 20px; font-size:0.8rem; box-shadow:none;">Logout</button>
      </div>
      
      <div id="nav-guest" style="display:flex;gap:10px;">
        <a href="login.html" style="text-decoration:none; color:var(--text-dark); font-weight:600; font-size:0.9rem; padding-top:8px;">Login</a>
        <a href="register.html" class="cta-btn" style="padding:10px 24px; font-size:0.9rem;">Sign Up</a>
      </div>
    </div>
  </div>
</header>

<!-- Filter Section -->
<div style="background:white; border-bottom:1px solid var(--border); padding:100px 0 20px; position:sticky; top:0; z-index:900;">
  <div class="nav-container">
    <div style="display:flex; gap:12px; overflow-x:auto; padding:10px 0;">
      <button class="cta-btn cat-filter active" data-cat="all" onclick="filterByCat('all')" style="padding:10px 24px; font-size:0.85rem; box-shadow:none;">All Collection</button>
      <button class="secondary-btn cat-filter" data-cat="A" onclick="filterByCat('A')" style="padding:10px 24px; font-size:0.85rem;">🥗 Organic Food</button>
      <button class="secondary-btn cat-filter" data-cat="B" onclick="filterByCat('B')" style="padding:10px 24px; font-size:0.85rem;">💄 Natural Cosmetics</button>
      <button class="secondary-btn cat-filter" data-cat="C" onclick="filterByCat('C')" style="padding:10px 24px; font-size:0.85rem;">🙏 Spirituals</button>
      <button class="secondary-btn cat-filter" data-cat="D" onclick="filterByCat('D')" style="padding:10px 24px; font-size:0.85rem;">🌱 Sara Nursery</button>
    </div>
  </div>
</div>

<main style="padding:40px 0 100px;">
  <div class="nav-container">
    <div style="margin-bottom:40px;">
      <h1 class="section-title" style="font-size:2.2rem; text-align:left;">Our Catalog</h1>
      <p class="section-sub" style="text-align:left;">Sourced with care, delivered with love.</p>
    </div>

    <div class="product-grid" id="product-grid">
      <!-- Skeleton -->
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>
</main>

<!-- CART DRAWER -->
<div id="cart-drawer" class="cart-drawer hidden">
  <div class="cart-header">
    <span>🛒 Your Selection</span>
    <button id="cart-close">✕</button>
  </div>
  <div id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total" id="cart-total">Total: Rs. 0</div>
    <button class="checkout-btn">Proceed to Checkout</button>
  </div>
</div>

<!-- CHATBOT -->
<div id="chat-toggle" class="chat-toggle"><img src="avatar.png" alt="Sara AI"></div>
<div id="chat-widget" class="chat-container hidden">
  <div class="chat-header">
    <div class="header-info"><div class="header-avatar-container"><img src="avatar.png" class="header-avatar" alt="Sara AI"><span class="online-dot"></span></div>
      <div class="header-text"><h1>Sara AI</h1><p>Wellness Assistant</p></div>
    </div>
    <button class="close-btn" id="close-chat">✕</button>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="typing" id="typing-indicator">...</div>
  <div class="chat-input-area">
    <div class="input-wrapper"><input id="user-input" type="text" placeholder="Ask about a product..."></div>
    <button id="send-btn">Send</button>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/products.js"></script>
<script src="script.js"></script>
<script>
// Specific filters handling
function filterByCat(catCode) {
    document.querySelectorAll('.cat-filter').forEach(btn => {
        btn.classList.remove('cta-btn');
        btn.classList.add('secondary-btn');
        btn.style.boxShadow = 'none';
        if(btn.dataset.cat === catCode) {
            btn.classList.remove('secondary-btn');
            btn.classList.add('cta-btn');
        }
    });
    
    // Call the global filter logic from products.js
    if (window.filterProducts) window.filterProducts(catCode);
}

document.addEventListener('DOMContentLoaded', function(){
    const urlCat = new URLSearchParams(window.location.search).get('cat');
    if (urlCat) filterByCat(urlCat);
});
</script>
</body>
</html>
