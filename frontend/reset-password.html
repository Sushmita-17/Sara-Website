<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password | Sara Foods</title>
<link rel="stylesheet" href="style.css">
</head>
<body style="background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;">

<div class="product-card" style="width:100%; max-width:440px; padding:48px; box-shadow:var(--shadow-lg);">
    <div style="text-align:center; margin-bottom:32px;">
        <a href="/" style="text-decoration:none; display:inline-flex; align-items:center; gap:12px; color:var(--brand-primary); font-weight:800; font-size:1.8rem; margin-bottom:16px;">
            <img src="avatar.png" alt="Sara Foods" style="height:48px; width:48px; border-radius:50%; border:2px solid var(--brand-accent);">
            Sara Foods
        </a>
        <h1 style="font-size:1.8rem; color:var(--text-dark); margin-bottom:8px;">New Password</h1>
        <p style="color:var(--text-muted); font-size:0.95rem;">Create a secure password for your account</p>
    </div>

    <div id="reset-alert" class="badge" style="display:none; width:100%; padding:12px; margin-bottom:24px; text-align:center;"></div>

    <form id="reset-form">
        <div style="margin-bottom:20px;">
            <label for="reset-pass" style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:8px; color:var(--text-dark);">New Password</label>
            <input type="password" id="reset-pass" placeholder="At least 8 characters" required style="width:100%; padding:14px 20px; border-radius:var(--radius); border:1.5px solid var(--border); outline:none; font-family:inherit; transition:border-color 0.3s;">
        </div>
        <div style="margin-bottom:32px;">
            <label for="reset-confirm" style="display:block; font-weight:600; font-size:0.9rem; margin-bottom:8px; color:var(--text-dark);">Confirm New Password</label>
            <input type="password" id="reset-confirm" placeholder="Confirm your new password" required style="width:100%; padding:14px 20px; border-radius:var(--radius); border:1.5px solid var(--border); outline:none; font-family:inherit; transition:border-color 0.3s;">
        </div>
        
        <button type="submit" id="reset-btn" class="cta-btn" style="width:100%; padding:16px; font-size:1rem;">Reset Password</button>
    </form>
</div>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
